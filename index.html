<!doctype html>
<html lang="ru">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9510884043494446"
     crossorigin="anonymous"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шахта</title>
<script src="https://bridge.playgama.com/v1/stable/playgama-bridge.js"></script>
<style>
:root{--bg:#e6ebf1;--card:#fff;--ink:#1d2430;--mute:#5d6878;--line:#d3d9e2;--acc:#0f8a68;--accInk:#fff;--gold:#a96d05;--rock:#8a7f74;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a23;--card:#212735;--ink:#e8ecf3;--mute:#9aa5b6;--line:#303849;--acc:#3dd6a8;--accInk:#0b2a21;--gold:#f0b429}}
:root[data-theme="dark"]{--bg:#161a23;--card:#212735;--ink:#e8ecf3;--mute:#9aa5b6;--line:#303849;--acc:#3dd6a8;--accInk:#0b2a21;--gold:#f0b429}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:16px 14px 40px}
.top{text-align:center}
#coins{font-size:44px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
#ps{color:var(--mute);font-size:15px;margin-top:2px}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;margin:14px 0 6px}
#rock{background:none;border:0;padding:0;width:210px;cursor:pointer;transition:transform .07s}
#rock:active{transform:scale(.93)}
#rock:focus-visible,.buy:focus-visible,.act:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#rock svg{display:block;width:100%;height:auto}
.depth{margin-top:4px;font-weight:600;font-size:18px}
.strata{color:var(--mute);font-size:14px;display:flex;align-items:center;gap:6px}
.strata i{width:12px;height:12px;border-radius:3px;background:var(--rock);display:inline-block}
.fl{position:absolute;font-weight:800;color:var(--gold);pointer-events:none;animation:up .8s ease-out forwards;font-size:20px}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.act{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;line-height:1.25}
.act small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.act.on{border-color:var(--acc)}
.act:disabled{opacity:.45;cursor:default}
.act.on:disabled{opacity:1}
.tgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-4px 0 14px}
.tgs .act{padding:8px;font-weight:400;color:var(--mute)}
.tgs .act.on{color:var(--ink);font-weight:600}
.ranks{display:flex;justify-content:space-between;gap:4px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 8px}
.rk{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.rk i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 4px;background:var(--line);border:2px solid transparent}
.rk.got{color:var(--ink);font-weight:600}
.rk.got i{background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}
.rk.cur i{border-color:var(--ink)}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.pt{font-weight:600;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);margin:8px 0;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.pd{color:var(--mute);font-size:13px;line-height:1.4}
.act.ready{border-color:var(--gold);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(240,180,41,.4)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin-bottom:8px}
.inf b{font-size:16px;display:block}
.inf span{color:var(--mute);font-size:13px}
.buy{flex:none;min-width:96px;border:0;border-radius:10px;background:var(--acc);color:var(--accInk);font:inherit;font-weight:600;font-size:15px;padding:10px 12px;cursor:pointer}
.buy:disabled{background:var(--line);color:var(--mute);cursor:default}
h2{font-size:15px;margin:18px 2px 8px;color:var(--mute);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.fl{animation:none;opacity:0}#rock{transition:none}.act.ready{animation:none}}
.off{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--gold);border-radius:14px;padding:10px 12px;margin:10px 0 0;font-size:14px}
.off[hidden]{display:none}
.off span{flex:1}
.off .buy{min-width:0;padding:8px 10px;font-size:14px}
.noads #boost,.noads #chest{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div id="coins">0</div><div id="ps"></div></div>
  <div class="off" id="off" hidden><span id="offt"></span><button class="buy" id="offb"></button><button class="buy" id="offx" style="background:var(--line);color:var(--mute)">Ок</button></div>
  <div class="stage" id="stage">
    <button id="rock" aria-label="Копать">
      <svg viewBox="0 0 200 170" aria-hidden="true">
        <polygon points="18,152 36,72 84,24 142,34 184,86 178,152" fill="var(--rock)"/>
        <polygon points="36,72 84,24 112,92 60,112" fill="#fff" opacity=".2"/>
        <polygon points="112,92 142,34 184,86 150,120" fill="#000" opacity=".12"/>
        <polygon points="18,152 60,112 112,92 150,120 178,152" fill="#000" opacity=".22"/>
        <polygon points="96,70 108,50 122,72 110,86" fill="#3dd6a8"/>
        <polygon points="52,120 60,104 70,122 60,132" fill="#f0b429"/>
        <polygon points="138,128 148,110 158,130 148,140" fill="#5aa9ff"/>
      </svg>
    </button>
    <div class="depth" id="depth"></div>
    <div class="strata"><i id="sw"></i><span id="sn"></span></div>
  </div>
  <div class="acts">
    <button class="act" id="boost"></button>
    <button class="act" id="prest"></button>
    <button class="act" id="chest" style="grid-column:1/-1"></button>
  </div>
  <div class="pcard"><div class="pt" id="pt"></div><div class="bar"><b id="pb"></b></div><div class="pd" id="pd"></div></div>
  <div class="tgs"><button class="act" id="tsnd"></button><button class="act" id="tmus"></button></div>
  <h2 id="rh"></h2>
  <div class="ranks" id="ranks"></div>
  <h2>Улучшения</h2>
  <div id="list"></div>
</div>
<div id="toast" role="status"></div>
<script>
const KEY='mine_v1', CAP=4*3600;
const W=[{n:'Шахтёр',b:15,r:.5},{n:'Бур',b:110,r:4},{n:'Вагонетка',b:1200,r:25},{n:'Экскаватор',b:13000,r:140},{n:'Лифт в глубину',b:150000,r:900},{n:'Плазменный бур',b:1800000,r:6000}];
const ST=[{d:0,n:'Глина',c:'#a5764f'},{d:50,n:'Известняк',c:'#b9b2a0'},{d:200,n:'Гранит',c:'#8d8a94'},{d:600,n:'Кварц',c:'#9fb4cc'},{d:1500,n:'Базальт',c:'#566070'},{d:4000,n:'Магма',c:'#b4472f'}];
const SU=['','тыс','млн','млрд','трлн','квдр','квнт'];
const fresh=()=>({coins:0,run:0,k:0,w:W.map(()=>0),nug:0,pr:0,boost:0,chest:0,t:Date.now()});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(fresh(),o);if(!Array.isArray(S.w)||S.w.length!==W.length)S.w=W.map((_,i)=>(o.w&&o.w[i])||0)}}catch(e){}

const $=id=>document.getElementById(id);
function fmt(n){if(n<1000)return (n<10?Math.floor(n*10)/10:Math.floor(n)).toLocaleString('ru-RU');let i=0;while(n>=1000&&i<SU.length-1){n/=1000;i++}return n.toFixed(n<10?2:n<100?1:0).replace('.',',')+' '+SU[i]}
const mult=()=>(1+.1*S.nug)*(S.boost>Date.now()?2:1);
const ps=()=>W.reduce((a,w,i)=>a+w.r*S.w[i],0)*mult();
const clickPow=()=>(1+S.k)*mult();
const wCost=i=>Math.ceil(W[i].b*Math.pow(1.15,S.w[i]));
const kCost=()=>Math.ceil(25*Math.pow(1.6,S.k));
const pGain=()=>Math.floor(Math.sqrt(S.run/5e4));
function gain(x){S.coins+=x;S.run+=x}
function save(force){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(cloudOk&&br&&(force||Date.now()-lastCloud>30000)){lastCloud=Date.now();try{const p=br.storage.set('mine_s',JSON.stringify(S));if(p&&p.catch)p.catch(()=>{})}catch(e){}}}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

// ранги за каждое обновление шахты
const RK=[{n:'Бронза',c:'#b87333'},{n:'Серебро',c:'#b8c0cc'},{n:'Золото',c:'#f0b429'},{n:'Платина',c:'#7fd1e0'},{n:'Алмаз',c:'#5aa9ff'},{n:'Легенда',c:'#c77dff'}];
$('ranks').innerHTML=RK.map(r=>`<div class='rk' style='--c:${r.c}'><i></i>${r.n}</div>`).join('');

// звук и музыка: синтез в браузере, файлы не нужны
let AC=null,MG,SG,NB,snd=true,musOn=true,mNext=0,mStep=0;
try{const p=JSON.parse(localStorage.getItem('mine_snd')||'{}');if(p.s===0)snd=false;if(p.m===0)musOn=false}catch(e){}
const savePrefs=()=>{try{localStorage.setItem('mine_snd',JSON.stringify({s:snd?1:0,m:musOn?1:0}))}catch(e){}};
function ac(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();
    SG=AC.createGain();SG.gain.value=.5;SG.connect(AC.destination);
    MG=AC.createGain();MG.gain.value=musOn?.35:0;MG.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    mNext=AC.currentTime+.1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,when,dur,type,vol,slide,dest){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,when);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,when+dur);
  g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.02);g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g);g.connect(dest);o.start(when);o.stop(when+dur+.05)}
const T=(f,off,d,type,v,sl)=>{if(snd&&ac())tone(f,AC.currentTime+off,d,type,v,sl,SG)};
const sfx={
  hit(){if(!snd||!ac())return;const t=AC.currentTime,r=.85+Math.random()*.3;
    tone(190*r,t,.12,'triangle',.7,60,SG);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='bandpass';f.frequency.value=2200*r;f.Q.value=.8;
    g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);s.connect(f);f.connect(g);g.connect(SG);s.start(t);s.stop(t+.1);
    if(Math.random()<.18)tone(1320*r,t+.03,.18,'sine',.25,0,SG)},
  buy(){T(660,0,.1,'square',.12);T(990,.07,.16,'square',.12)},
  boost(){[523,659,784,1047].forEach((f,i)=>T(f,i*.07,.18,'triangle',.3))},
  rank(){[523,659,784,1047,1319].forEach((f,i)=>{T(f,i*.12,.5,'triangle',.35);T(f/2,i*.12,.5,'square',.08)})}
};
const CH=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]],BS=[110,87.31,130.81,98],PT=[0,1,2,1,2,1,0,2];
setInterval(()=>{if(!AC||!musOn||AC.state!=='running')return;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.4){const ci=Math.floor(mStep/8)%4,k=mStep%8;
    if(k===0){tone(BS[ci],mNext,2.8,'sine',.5,0,MG);CH[ci].forEach(f=>tone(f,mNext,2.8,'sine',.12,0,MG))}
    tone(CH[ci][PT[k]]*2,mNext,.55,'triangle',.22,0,MG);mStep++;mNext+=.34}},120);
document.addEventListener('pointerdown',()=>{ac()});
$('tsnd').addEventListener('click',()=>{snd=!snd;savePrefs();if(snd)sfx.buy();render()});
$('tmus').addEventListener('click',()=>{musOn=!musOn;savePrefs();if(ac()){MG.gain.value=musOn?.35:0;mNext=AC.currentTime+.05}render()});

// подсказка про новую шахту
let pReady=pGain()>=1;
const mx=n=>'×'+(1+.1*n).toFixed(1).replace('.',',');
function prestInfo(g,p){
  const Q=5e4,n=S.nug;
  if(g<1){
    pReady=false;p.classList.remove('ready');
    $('pt').textContent='Новая шахта пока закрыта';
    $('pb').style.width=Math.min(100,S.run/Q*100)+'%';
    $('pd').textContent='Добыто за заход: '+fmt(S.run)+' из '+fmt(Q)+'. Потом сброс даст +10% к доходу навсегда и новый ранг.';
    return}
  const rec=g>=Math.max(1,n*.5),lo=g*g*Q,hi=(g+1)*(g+1)*Q;
  if(!pReady){pReady=true;sfx.boost();toast('Новая шахта открыта: сброс даст +'+g*10+'% к доходу')}
  p.classList.toggle('ready',rec);
  $('pt').textContent=rec?'Выгодно сбросить сейчас':'Открыта, но лучше добыть ещё';
  $('pb').style.width=Math.min(100,(S.run-lo)/(hi-lo)*100)+'%';
  $('pd').textContent='Доход сейчас '+mx(n)+', после сброса '+mx(n+g)+' и ранг '+RK[Math.min(S.pr,RK.length-1)].n+'. Монеты и улучшения сбросятся, самородки и ранг останутся. До следующего самородка: '+fmt(hi-S.run)+'.'}

// список улучшений
const list=$('list');
list.innerHTML='<div class="row" data-i="k"><div class="inf"><b>Кирка</b><span></span></div><button class="buy"></button></div>'+
W.map((w,i)=>'<div class="row" data-i="'+i+'"><div class="inf"><b>'+w.n+'</b><span></span></div><button class="buy"></button></div>').join('');
list.addEventListener('click',e=>{const b=e.target.closest('.buy');if(!b)return;const i=b.parentNode.dataset.i;
  if(i==='k'){const c=kCost();if(S.coins>=c){S.coins-=c;S.k++;sfx.buy()}}
  else{const c=wCost(+i);if(S.coins>=c){S.coins-=c;S.w[+i]++;sfx.buy()}}
  render()});

// клик по породе
$('rock').addEventListener('click',e=>{
  const p=clickPow();gain(p);sfx.hit();
  const st=$('stage'),r=st.getBoundingClientRect();
  const x=e.detail===0?r.width/2:e.clientX-r.left, y=e.detail===0?r.height/2:e.clientY-r.top;
  const f=document.createElement('span');f.className='fl';f.textContent='+'+fmt(p);
  f.style.left=(x-14)+'px';f.style.top=(y-24)+'px';st.appendChild(f);setTimeout(()=>f.remove(),800);
  render()});

// реклама за бонус (заглушка)
let adBusy=false;
function showRewardedAd(done){
  adBusy=true;render();
  if(!br){setTimeout(()=>{adBusy=false;done()},1500);return}
  const r=rw={done,ok:false};
  setTimeout(()=>{if(rw===r)rwEnd(true)},120000);
  try{br.advertisement.showRewarded()}catch(e){rwEnd(true)}}
$('boost').addEventListener('click',()=>{if(adBusy||S.boost>Date.now())return;showRewardedAd(()=>{S.boost=Date.now()+60000;sfx.boost();toast('Доход ×2 на 60 секунд');render()})});

// новая шахта (престиж), подтверждение вторым нажатием
// Playgama Bridge: один SDK для разных площадок (реклама, облачное сохранение, пауза)
let br=null,cloudOk=false,lastCloud=0,offG=0,rw=null;
const pause=b=>{try{if(AC){b?AC.suspend():AC.resume()}if(br&&br.PLATFORM_MESSAGE){const M=br.PLATFORM_MESSAGE;br.platform.sendMessage(b?M.GAMEPLAY_STOPPED:M.GAMEPLAY_STARTED)}}catch(e){}};
function rwEnd(fail){if(!rw)return;const r=rw;rw=null;adBusy=false;pause(false);
  if(fail){toast('Реклама сейчас недоступна, попробуй позже');render()}else if(r.ok)r.done();else render()}
function showInter(){if(!br||!br.advertisement.isInterstitialSupported)return;try{br.advertisement.showInterstitial()}catch(e){}}
async function initBridge(){
  try{if(typeof bridge==='undefined')return;
    await bridge.initialize();br=bridge;const A=br.advertisement,E=br.EVENT_NAME;
    try{A.setMinimumDelayBetweenInterstitial(60)}catch(e){}
    A.on(E.REWARDED_STATE_CHANGED,st=>{if(!rw)return;
      if(st==='opened')pause(true);else if(st==='rewarded'){rw.ok=true;setTimeout(()=>rwEnd(false),1500)}
      else if(st==='closed')rwEnd(false);else if(st==='failed')rwEnd(true)});
    A.on(E.INTERSTITIAL_STATE_CHANGED,st=>{if(st==='opened')pause(true);else if(st==='closed'||st==='failed')pause(false)});
    if(!A.isRewardedSupported)document.body.classList.add('noads');
    cloudOk=true;
    try{const v=await br.storage.get('mine_s');const c=typeof v==='string'?JSON.parse(v):v;
      if(c&&c.t>S.t){const k=Object.assign(fresh(),c);if(!Array.isArray(k.w)||k.w.length!==W.length)k.w=W.map((_,i)=>(c.w&&c.w[i])||0);S=k;pReady=pGain()>=1}}catch(e){}
  }catch(e){br=null}}
const chestVal=()=>Math.max(ps()*600,100);
$('chest').addEventListener('click',()=>{if(adBusy||S.chest>Date.now())return;
  showRewardedAd(()=>{const v=chestVal();gain(v);S.chest=Date.now()+180000;sfx.boost();toast('Сундук: +'+fmt(v));render()})});
function offer(g){if(document.body.classList.contains('noads'))return;offG=g;$('offt').textContent='Пока тебя не было: +'+fmt(g);$('offb').textContent='×2 за рекламу';$('off').hidden=false}
$('offx').addEventListener('click',()=>{$('off').hidden=true});
$('offb').addEventListener('click',()=>{if(adBusy)return;const g=offG;
  showRewardedAd(()=>{gain(g);$('off').hidden=true;toast('Получено ещё +'+fmt(g));render()})});

let arm=0;
$('prest').addEventListener('click',()=>{
  const g=pGain();if(g<1)return;
  if(!arm){arm=setTimeout(()=>{arm=0;render()},3000);render();return}
  clearTimeout(arm);arm=0;
  const nug=S.nug+g,pr=S.pr+1;S=fresh();S.nug=nug;S.pr=pr;sfx.rank();toast('Новая шахта! Ранг: '+RK[Math.min(pr,RK.length)-1].n);render();save(1);showInter()});

function render(){
  $('coins').textContent=fmt(S.coins);
  $('ps').textContent=fmt(ps())+' в секунду'+(S.nug?', самородков: '+S.nug:'');
  const d=Math.floor(Math.sqrt(S.run)/3);let s=ST[0];for(const x of ST)if(d>=x.d)s=x;
  $('depth').textContent='Глубина '+d.toLocaleString('ru-RU')+' м';$('sn').textContent=s.n;
  document.documentElement.style.setProperty('--rock',s.c);$('sw').style.background=s.c;
  const rows=list.children;
  {const r=rows[0],c=kCost();r.querySelector('span').textContent='Уровень '+S.k+', +'+fmt(clickPow())+' за клик';
   const b=r.querySelector('.buy');b.textContent=fmt(c);b.disabled=S.coins<c}
  W.forEach((w,i)=>{const r=rows[i+1],c=wCost(i);
    r.querySelector('span').textContent='Куплено: '+S.w[i]+', по '+fmt(w.r*mult())+'/с';
    const b=r.querySelector('.buy');b.textContent=fmt(c);b.disabled=S.coins<c});
  const bo=$('boost'),left=Math.ceil((S.boost-Date.now())/1000);
  if(left>0){bo.classList.add('on');bo.innerHTML='Бонус ×2 активен<small>ещё '+left+' с</small>';bo.disabled=true}
  else{bo.classList.remove('on');bo.innerHTML='Доход ×2 на 60 с<small>смотреть рекламу</small>';bo.disabled=adBusy}
  {const ch=$('chest'),w=Math.ceil((S.chest-Date.now())/1000);
   if(w>0){ch.disabled=true;ch.innerHTML='Сундук откроется через '+Math.floor(w/60)+':'+String(w%60).padStart(2,'0')+'<small>можно открыть снова</small>'}
   else{ch.disabled=adBusy;ch.innerHTML='Сундук: +'+fmt(chestVal())+' монет<small>смотреть рекламу</small>'}}
  const cur=Math.min(S.pr,RK.length);
  $('rh').textContent='Ранг: '+(cur?RK[cur-1].n:'Новичок')+(S.pr?' (обновлений шахты: '+S.pr+')':'');
  [...$('ranks').children].forEach((c,i)=>{c.classList.toggle('got',S.pr>i);c.classList.toggle('cur',cur===i+1)});
  $('tsnd').className='act'+(snd?' on':'');$('tsnd').textContent='Звук: '+(snd?'вкл':'выкл');
  $('tmus').className='act'+(musOn?' on':'');$('tmus').textContent='Музыка: '+(musOn?'вкл':'выкл');
  const p=$('prest'),g=pGain();p.disabled=g<1;
  p.innerHTML=arm?'Нажми ещё раз<small>прогресс сбросится</small>':'Новая шахта<small>'+(g>=1?'ранг '+RK[Math.min(S.pr,RK.length-1)].n+', +'+g*10+'% дохода':'откроется на 50 тыс.')+'</small>';prestInfo(g,p)}

function tick(){const n=Date.now();let dt=Math.max(0,(n-S.t)/1000);S.t=n;if(dt>CAP)dt=CAP;
  const g=ps()*dt;gain(g);if(dt>60&&g>0)offer(g);render()}

document.addEventListener('contextmenu',e=>e.preventDefault());
(async()=>{render();
  await Promise.race([initBridge(),new Promise(r=>setTimeout(r,5000))]);
  tick();setInterval(tick,250);setInterval(()=>save(),5000);
  try{if(br){const M=br.PLATFORM_MESSAGE;br.platform.sendMessage(M.GAME_READY);br.platform.sendMessage(M.GAMEPLAY_STARTED)}}catch(e){}})();
addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden){save(1);pause(true)}else{tick();if(!adBusy)pause(false)}});
</script>
</body>
</html>
